name: Retire MARKET to MON COMMERCE

on:
  push:
    paths:
      - '.github/workflows/retire-market-to-commerce.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace active MARKET pages with transition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target='https://mon-commerce.digiylyfe.com/'
          stub='''<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>DIGIYLYFE — MON COMMERCE</title>\n<meta name="robots" content="noindex,follow">\n<link rel="canonical" href="https://mon-commerce.digiylyfe.com/">\n<meta http-equiv="refresh" content="0;url=https://mon-commerce.digiylyfe.com/">\n<script>location.replace('https://mon-commerce.digiylyfe.com/');</script>\n</head>\n<body>\n<p>DIGIY MARKET a évolué vers <a href="https://mon-commerce.digiylyfe.com/">MON COMMERCE</a>.</p>\n</body>\n</html>\n'''

          htmls=[p for p in Path('.').rglob('*.html') if 'ARCHIVE' not in p.parts and '.github' not in p.parts]
          assert htmls, 'No active HTML files found'
          for p in htmls:
              p.write_text(stub)

          Path('robots.txt').write_text('User-agent: *\nAllow: /\nDisallow: /products.json\nDisallow: /ARCHIVE/\n')
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>\n')
          Path('.github/workflows/retire-market-to-commerce.yml').unlink()
          print(f'Retired {len(htmls)} active MARKET HTML pages')
          PY
      - name: Commit retirement and cleanup workflow
        shell: bash
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Retirer MARKET au profit de MON COMMERCE"
          git push
