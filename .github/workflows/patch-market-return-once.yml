name: Patch MARKET return once

on:
  push:
    paths:
      - '.github/workflows/patch-market-return-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add universal DIGIYLYFE return
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'data-digiy-return-home="1"' not in text:
              block = '''<a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 0 14px;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(7,63,50,.20);box-sizing:border-box">← RETOUR DIGIYLYFE.COM</a>'''
              if '<main>' not in text:
                  raise SystemExit('main tag not found')
              text = text.replace('<main>', '<main>\n  ' + block, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-market-return-once.yml
          git add index.html
          git commit -m "UI: add DIGIYLYFE.COM return on MARKET"
          git push
