name: Remove FG NAILS from MARKET once

on:
  push:
    branches: [main]
    paths:
      - '.fg-market-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove FG NAILS listing only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          matches = list(re.finditer(r'<article class="listing">.*?</article>', s, flags=re.S))
          fg = [m for m in matches if 'FG NAILS' in m.group(0) or 'f-g-nails.digiylyfe.com' in m.group(0)]
          if len(fg) != 1:
              raise SystemExit(f'Attendu 1 bloc FG NAILS, trouvé {len(fg)}')

          m = fg[0]
          s = s[:m.start()] + s[m.end():]

          if 'FG NAILS' in s or 'f-g-nails.digiylyfe.com' in s:
              raise SystemExit('Référence FG NAILS encore présente dans index.html')
          if 'Astou Boutique' not in s:
              raise SystemExit('Protection : Astou Boutique a disparu')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit clean MARKET index
        shell: bash
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add index.html
          git rm .fg-market-trigger .github/workflows/remove-fg-market-once.yml
          git commit -m "Retire FG NAILS de DIGIY MARKET"
          git push
