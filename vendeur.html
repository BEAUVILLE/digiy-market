<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#063b2b"/>
  <title>DIGIY MARKET — Porte vendeur</title>
  <meta name="description" content="Ancienne porte vendeur DIGIY MARKET : ouverture vers la fiche boutique publique ou vers l’espace vendeur sécurisé."/>
  <meta name="robots" content="noindex,follow"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet"/>

  <script>
    /*
      DIGIY MARKET — vendeur.html
      Ancienne vitrine / porte vendeur conservée pour compatibilité.
      - Côté client : on ouvre shop.html
      - Côté pro : on ouvre pro-market/pin.html
      - Les anciens liens avec slug / phone ne cassent pas.
      - On nettoie la façade pour ne pas garder phone/slug visibles ici.
    */
    (function(){
      "use strict";

      var MARKET_HOME = "./index.html";
      var SHOP_PAGE = "./shop.html";
      var PRO_PIN = "https://pro-market.digiylyfe.com/pin.html";

      var qs = new URLSearchParams(location.search);

      function normSlug(v){
        return String(v || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g,"-")
          .replace(/[^a-z0-9-]/g,"")
          .replace(/-+/g,"-")
          .replace(/^-|-$/g,"");
      }

      function normPhone(v){
        var d = String(v || "").replace(/[^\d]/g,"");
        if(!d) return "";
        if(d.indexOf("221") === 0 && d.length === 12) return d;
        if(d.length === 9) return "221" + d;
        return "";
      }

      function cleanText(v){
        return String(v || "").trim().slice(0, 120);
      }

      function storeBoth(key, value){
        if(!value) return;
        try{ sessionStorage.setItem(key, value); }catch(_){}
        try{ localStorage.setItem(key, value); }catch(_){}
      }

      function resolveSlug(){
        var slug =
          normSlug(qs.get("slug")) ||
          normSlug(qs.get("market_slug")) ||
          normSlug(qs.get("workspace_slug")) ||
          normSlug(qs.get("boutique")) ||
          normSlug(qs.get("shop")) ||
          "";

        var phone =
          normPhone(qs.get("phone")) ||
          normPhone(qs.get("tel")) ||
          normPhone(qs.get("whatsapp")) ||
          normPhone(qs.get("market_phone")) ||
          normPhone(qs.get("owner_phone")) ||
          "";

        if(!slug && phone) slug = "market-" + phone;
        return { slug: slug, phone: phone };
      }

      function buildShopTarget(){
        var ctx = resolveSlug();
        var product =
          cleanText(qs.get("product")) ||
          cleanText(qs.get("item")) ||
          cleanText(qs.get("title")) ||
          "";

        var target = new URL(SHOP_PAGE, location.href);
        if(ctx.slug) target.searchParams.set("slug", ctx.slug);
        if(product) target.searchParams.set("product", product);

        return target.pathname + target.search + target.hash;
      }

      function buildProTarget(){
        /*
          Pour le pro, on évite d’envoyer phone/slug dans l’URL.
          On range seulement en storage local si un ancien lien l’apporte.
        */
        var ctx = resolveSlug();

        if(ctx.slug){
          storeBoth("digiy_market_slug", ctx.slug);
          storeBoth("digiy_market_last_slug", ctx.slug);
          storeBoth("market_slug", ctx.slug);
        }

        if(ctx.phone){
          storeBoth("digiy_market_phone", ctx.phone);
          storeBoth("digiy_market_last_phone", ctx.phone);
          storeBoth("market_phone", ctx.phone);
        }

        return PRO_PIN;
      }

      window.__DIGIY_SHOP_TARGET__ = buildShopTarget();
      window.__DIGIY_PRO_TARGET__ = buildProTarget();
      window.__DIGIY_MARKET_HOME__ = MARKET_HOME;

      try{
        if(location.search){
          history.replaceState({}, document.title, location.pathname + location.hash);
        }
      }catch(_){}

      window.__DIGIY_OPEN_SHOP__ = function(){
        location.href = window.__DIGIY_SHOP_TARGET__ || SHOP_PAGE;
      };

      window.__DIGIY_OPEN_PRO__ = function(){
        location.href = window.__DIGIY_PRO_TARGET__ || PRO_PIN;
      };

      window.__DIGIY_OPEN_MARKET__ = function(){
        location.href = window.__DIGIY_MARKET_HOME__ || MARKET_HOME;
      };

      setTimeout(function(){
        /*
          Par défaut, cette ancienne porte reste publique :
          elle ouvre la fiche boutique, pas le coffre pro.
        */
        location.replace(window.__DIGIY_SHOP_TARGET__ || SHOP_PAGE);
      }, 150);
    })();
  </script>

  <style>
    :root{
      --green:#063b2b;
      --green2:#0b5a41;
      --gold:#d6ad39;
      --gold2:#f4cf64;
      --ink:#10251c;
      --muted:#68746e;
      --line:rgba(16,37,28,.12);
      --shadow:0 20px 60px rgba(6,59,43,.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:18px;
      color:var(--ink);
      background:
        radial-gradient(900px 520px at 6% -8%, rgba(214,173,57,.20), transparent 58%),
        radial-gradient(900px 520px at 105% 0%, rgba(6,59,43,.14), transparent 54%),
        linear-gradient(180deg,#fff8ea 0%,#f4ecd9 48%,#efe3cc 100%);
      font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    main{
      width:min(100%,590px);
      display:grid;
      gap:14px;
      text-align:center;
      padding:24px;
      border:1px solid var(--line);
      border-radius:30px;
      background:rgba(255,255,255,.82);
      box-shadow:var(--shadow);
    }

    .mark{
      width:74px;
      height:74px;
      margin:auto;
      border-radius:24px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--gold2),var(--gold));
      color:#2d2308;
      font-size:36px;
      box-shadow:0 14px 34px rgba(6,59,43,.16);
    }

    .eyebrow{
      color:var(--green);
      font-size:13px;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-weight:1000;
    }

    h1{
      margin:0;
      font-size:clamp(2.1rem,9vw,3.65rem);
      line-height:1;
      letter-spacing:-.055em;
      font-weight:1000;
    }

    p{
      margin:0;
      color:var(--muted);
      font-size:1.05rem;
      font-weight:850;
      line-height:1.55;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:4px;
    }

    button,a{
      min-height:58px;
      border-radius:18px;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:0 16px;
      text-decoration:none;
      font:inherit;
      font-size:1rem;
      font-weight:1000;
      cursor:pointer;
      background:#fff;
      color:var(--green);
      box-shadow:0 10px 24px rgba(6,59,43,.10);
    }

    .primary{
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#fff;
      border:0;
    }

    .gold{
      background:linear-gradient(135deg,var(--gold2),var(--gold));
      color:#2d2308;
      border:0;
    }

    .soft{
      background:#fff;
      color:var(--green);
    }

    .foot{
      font-size:.82rem;
      color:rgba(104,116,110,.86);
      font-weight:900;
      line-height:1.45;
    }
  </style>
</head>

<body>
  <main>
    <div class="mark">🛍️</div>
    <div class="eyebrow">DIGIY MARKET</div>

    <h1>Porte vendeur</h1>

    <p>
      Cette ancienne vitrine est gardée pour ne perdre aucun lien.
      Côté client, elle ouvre la fiche boutique officielle.
      Côté professionnel, elle mène vers l’accès sécurisé.
    </p>

    <div class="actions">
      <button class="primary" type="button" onclick="window.__DIGIY_OPEN_SHOP__ && window.__DIGIY_OPEN_SHOP__()">
        🛍️ Voir la boutique
      </button>

      <button class="gold" type="button" onclick="window.__DIGIY_OPEN_PRO__ && window.__DIGIY_OPEN_PRO__()">
        🔑 Espace vendeur
      </button>

      <button class="soft" type="button" onclick="window.__DIGIY_OPEN_MARKET__ && window.__DIGIY_OPEN_MARKET__()">
        🧭 Retour au marché
      </button>
    </div>

    <div class="foot">
      Ancienne porte compatible · client vers shop.html · vendeur vers pro-market/pin.html
    </div>
  </main>
</body>
</html>
