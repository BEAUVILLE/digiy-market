<style>
:root{
  --bg:#fdf6ec;
  --bg2:#fffaf2;
  --card:#fffdf9;
  --card2:#fff8ef;
  --ink:#1a1208;
  --muted:#7a6a54;
  --line:#e8d8be;
  --gold:#c8860a;
  --orange:#e86820;
  --red:#c83830;
  --green:#28885a;
  --shadow:0 18px 52px rgba(26,18,8,.12);
  --shadow-soft:0 10px 28px rgba(26,18,8,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:"Nunito",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(232,104,32,.07), transparent 28%),
    radial-gradient(circle at top right, rgba(40,136,90,.05), transparent 22%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink);
  overflow-x:hidden;
}

a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit}

.wrap{
  width:min(1240px,calc(100% - 28px));
  margin:0 auto;
}

/* TOPBAR */
.topbar{
  position:sticky;
  top:0;
  z-index:120;
  background:rgba(253,246,236,.92);
  backdrop-filter:blur(16px);
  border-bottom:2px solid var(--line);
}
.topbar-inner{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:"Playfair Display",serif;
  font-weight:900;
  font-size:1.18rem;
}
.brand-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#e86820,#c83830);
  display:grid;
  place-items:center;
  font-size:1.08rem;
  box-shadow:0 5px 16px rgba(232,104,32,.3);
  overflow:hidden;
}
.brand-icon img{width:100%;height:100%;object-fit:cover}
.brand small{
  display:block;
  font-family:"Nunito",sans-serif;
  font-size:.72rem;
  font-weight:900;
  color:var(--muted);
  margin-top:2px;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  border:none;
  cursor:pointer;
  border-radius:999px;
  padding:11px 15px;
  font-weight:900;
  transition:.18s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:var(--orange);
  color:#fff;
  box-shadow:0 10px 20px rgba(232,104,32,.22);
}
.btn-primary:hover{background:var(--red)}
.btn-soft{
  background:#fff;
  border:1.5px solid var(--line);
  color:var(--ink);
}
.btn-soft:hover{background:#fff3df}

/* PAGE */
.page{padding:24px 0 46px}

/* HERO ROYAL */
.hero-shell{
  display:grid;
  gap:18px;
}
.hero{
  display:grid;
  grid-template-columns:1.12fr .88fr;
  gap:18px;
  align-items:stretch;
}
.card{
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:30px;
  box-shadow:var(--shadow);
}
.cover-card{
  overflow:hidden;
  position:relative;
}
.cover-media{
  position:relative;
  min-height:520px;
  background:#f4ece0;
}
.cover-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
}
.cover-media::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.16) 36%,rgba(0,0,0,.42) 100%);
}
.cover-badges{
  position:absolute;
  left:18px;
  top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  z-index:3;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border-radius:999px;
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.04em;
}
.badge.example{
  background:rgba(255,255,255,.96);
  border:1px solid rgba(232,104,32,.2);
  color:var(--orange);
}
.badge.live{
  background:rgba(40,136,90,.92);
  color:#fff;
}
.badge.cat{
  background:rgba(26,18,8,.82);
  color:#fff;
}
.hero-copy{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:3;
  padding:22px 22px 24px;
  color:#fff;
}
.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  font-size:.76rem;
  font-weight:900;
  margin-bottom:12px;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.hero-copy h1{
  font-family:"Playfair Display",serif;
  font-weight:900;
  font-size:clamp(2rem,4vw,4rem);
  line-height:.93;
  margin-bottom:10px;
  text-shadow:0 8px 20px rgba(0,0,0,.22);
}
.hero-copy p{
  max-width:60ch;
  color:rgba(255,255,255,.86);
  line-height:1.7;
  font-size:1rem;
}

/* INFO PANEL */
.info-card{
  padding:20px;
  background:
    radial-gradient(circle at top right, rgba(232,104,32,.08), transparent 26%),
    linear-gradient(180deg,#fffdf9,#fff8f0);
}
.kicker{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border-radius:999px;
  background:#fff;
  border:1.5px solid var(--line);
  font-size:.76rem;
  font-weight:900;
  color:var(--orange);
}
.info-lead{
  margin-top:12px;
  color:var(--muted);
  line-height:1.76;
}
.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.mini{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}
.mini-label{
  font-size:.72rem;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:4px;
}
.mini-value{
  font-weight:900;
  line-height:1.45;
}
.cta-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
.note{
  margin-top:14px;
  padding:13px 14px;
  border-radius:18px;
  background:#fff8ed;
  border:1px solid #f6d7a3;
  color:#8d5a00;
  font-size:.86rem;
  line-height:1.65;
}

/* EDITO STRIP */
.edito-strip{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.edito-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow-soft);
}
.edito-card .top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
.edito-card .tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:#fff4df;
  border:1px solid #f3d09c;
  color:#8d5a00;
  font-size:.72rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.edito-card h3{
  font-family:"Playfair Display",serif;
  font-size:1.1rem;
  line-height:1.15;
  margin-bottom:6px;
}
.edito-card p{
  color:var(--muted);
  line-height:1.65;
  font-size:.9rem;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:18px;
  margin-top:18px;
}
.left-col,.right-col{display:grid;gap:18px}
.section-card{
  padding:18px;
}
.section-card h2{
  font-family:"Playfair Display",serif;
  font-size:1.4rem;
  font-weight:900;
  margin-bottom:12px;
}
.section-card p{
  color:var(--muted);
  line-height:1.75;
}

/* GALLERY */
.gallery-shell{
  display:grid;
  gap:14px;
  margin-top:14px;
}
.hero-photo{
  border-radius:26px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#f4ece0;
  box-shadow:var(--shadow-soft);
}
.hero-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  aspect-ratio:16/10;
}
.thumb-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.thumb{
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#f4ece0;
  cursor:pointer;
  transition:.18s ease;
}
.thumb:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-soft);
}
.thumb.active{
  outline:3px solid rgba(232,104,32,.22);
  border-color:#efc892;
}
.thumb img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}
.thumb small{
  display:block;
  padding:8px 10px;
  background:#fff;
  font-weight:800;
  color:var(--muted);
  font-size:.76rem;
  line-height:1.4;
}

/* PRODUCTS / BLOCKS */
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:14px;
}
.product{
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  padding:14px;
  box-shadow:var(--shadow-soft);
}
.product h3{
  font-size:1rem;
  margin-bottom:6px;
}
.product p{
  font-size:.88rem;
  line-height:1.6;
  margin-bottom:10px;
  color:var(--muted);
}
.price{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:#fef0d8;
  color:var(--gold);
  border:1px solid #f8d8a0;
  font-weight:900;
  font-size:.78rem;
}

/* SIDEBAR */
.side-list{display:grid;gap:10px}
.side-item{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  padding:13px;
}
.side-item .label{
  font-size:.72rem;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:4px;
}
.side-item .value{
  font-weight:900;
  line-height:1.5;
}

.module-box{
  padding:18px;
  border-radius:24px;
  background:linear-gradient(135deg,#fff8ed,#fff1dd);
  border:1.5px solid #f0d0a0;
}
.module-box h3{
  font-family:"Playfair Display",serif;
  font-size:1.2rem;
  margin-bottom:8px;
}
.module-box p{
  color:#7c5a12;
  line-height:1.7;
}
.module-box .row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.map-box{
  display:grid;
  gap:12px;
  margin-top:14px;
}
.fake-map{
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  background:#f4ece0;
}
.fake-map img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
}
.map-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.trust-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
}
.trust-list{
  display:grid;
  gap:10px;
}
.trust-item{
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  background:#fffdf9;
}
.trust-item strong{
  display:block;
  margin-bottom:4px;
}
.trust-item span{
  color:var(--muted);
  font-size:.86rem;
  line-height:1.55;
}

.empty-box{
  text-align:center;
  padding:32px 20px;
}
.empty-box h2{
  font-family:"Playfair Display",serif;
  font-size:1.7rem;
  margin-bottom:8px;
}
.empty-box p{
  color:var(--muted);
  line-height:1.7;
}

/* FLOAT CTA */
.float-cta{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:120;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.float-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:220px;
  padding:13px 16px;
  border-radius:999px;
  color:#fff;
  font-weight:900;
  box-shadow:0 16px 28px rgba(0,0,0,.18);
}
.float-btn.wa{background:#0b8f59}
.float-btn.module{background:linear-gradient(135deg,var(--orange),var(--red))}

/* RESPONSIVE */
@media(max-width:1080px){
  .hero,.layout{grid-template-columns:1fr}
}
@media(max-width:860px){
  .edito-strip{grid-template-columns:1fr}
  .thumb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
  .info-grid,.products,.thumb-grid{grid-template-columns:1fr}
  .topbar-inner{padding:10px 0}
  .cover-media{min-height:400px}
  .hero-copy h1{font-size:clamp(1.8rem,8vw,2.7rem)}
  .float-cta{left:12px;right:12px}
  .float-btn{min-width:0;width:100%}
}
</style>

<script>
const DEFAULT_CFG = {
  whatsapp: "221771342889",
  proUrl: "https://commencer-a-payer.digiylyfe.com/",
  logoUrl: ""
};

function readCatalog(){
  try{
    const raw = localStorage.getItem("digiy_market_catalog_v5");
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function safe(str=""){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function normPhone(v){
  const d = String(v || "").replace(/[^\d]/g, "");
  if (!d) return "";
  if (d.startsWith("221") && d.length === 12) return d;
  if (d.length === 9) return "221" + d;
  return d;
}

function parsePriceBase(price=""){
  const firstPart = String(price).split(/[–-]/)[0] || "";
  const digits = firstPart.replace(/[^\d]/g, "");
  if(!digits) return null;
  return parseInt(digits, 10);
}

function makePrice(base, n){
  if(!base) return "Prix à définir";
  const value = Math.round((base * n) / 1000) * 1000;
  return `${value.toLocaleString("fr-FR").replace(/\s/g," ")} F`;
}

function splitOffer(what=""){
  return what.split(",").map(x => x.trim()).filter(Boolean).slice(0,4);
}

function makeSvgData(title, subtitle, icon, c1, c2){
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </linearGradient>
      <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,.18)"/>
      </filter>
    </defs>
    <rect width="1200" height="900" fill="url(#g)"/>
    <circle cx="1030" cy="120" r="160" fill="rgba(255,255,255,.12)"/>
    <circle cx="190" cy="760" r="180" fill="rgba(255,255,255,.12)"/>
    <circle cx="860" cy="660" r="110" fill="rgba(255,255,255,.12)"/>
    <text x="100" y="230" font-size="190" filter="url(#f)">${icon}</text>
    <rect x="70" y="605" width="1060" height="180" rx="32" fill="rgba(255,255,255,.9)"/>
    <text x="120" y="680" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1a1208">${title}</text>
    <text x="120" y="740" font-family="Arial, sans-serif" font-size="30" fill="#6f624f">${subtitle}</text>
  </svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function makeMapSvg(title, subtitle){
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
    <rect width="1200" height="750" fill="#e9f1e7"/>
    <path d="M0 160 C240 120 340 240 560 200 C740 170 870 70 1200 120" stroke="#c6d8c2" stroke-width="90" fill="none"/>
    <path d="M-20 500 C180 430 360 560 620 510 C840 470 1000 310 1220 360" stroke="#d7cbb5" stroke-width="80" fill="none"/>
    <path d="M200 0 L260 750" stroke="#fff" stroke-width="18" opacity=".7"/>
    <path d="M760 0 L700 750" stroke="#fff" stroke-width="18" opacity=".7"/>
    <circle cx="610" cy="360" r="34" fill="#e86820"/>
    <path d="M610 410 C650 470 710 520 610 630 C510 520 570 470 610 410 Z" fill="#c83830"/>
    <circle cx="610" cy="360" r="15" fill="#fff"/>
    <rect x="70" y="540" width="1060" height="140" rx="28" fill="rgba(255,255,255,.92)"/>
    <text x="110" y="605" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#1a1208">${title}</text>
    <text x="110" y="646" font-family="Arial, sans-serif" font-size="26" fill="#6f624f">${subtitle}</text>
  </svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function palette(bg){
  const map = {
    "#c8deff":["#bdd8ff","#8cb7ff"],
    "#ffe0cb":["#ffd9c5","#ffb88a"],
    "#ffeaaa":["#fff0b8","#ffd56d"],
    "#ffd0e0":["#ffd8e5","#ffb1cb"],
    "#eadfff":["#eee2ff","#d2beff"],
    "#dbfff6":["#ddfff5","#afe9d5"],
    "#f4ead7":["#f6ead9","#ddc9a3"],
    "#dbf5ea":["#dff7ec","#b8e0ca"]
  };
  return map[bg] || ["#f4ead7","#d8bf96"];
}

function fallbackVendorImage(v){
  const [c1,c2] = palette(v.bg || "#f4ead7");
  return makeSvgData(v.name, v.loc || v.city || "DIGIY MARKET", v.icon || "🛍️", c1, c2);
}

function buildGallery(v){
  if(Array.isArray(v.images) && v.images.length){
    return v.images.map((src, i) => ({
      src,
      caption: i === 0 ? "Image héro" : `Vue ${i + 1}`
    }));
  }

  const [c1,c2] = palette(v.bg || "#f4ead7");
  const items = [
    {title:"Signature", sub:`${v.name}`, icon:v.icon || "🛍️"},
    {title:"Ambiance", sub:v.loc || v.city || "terrain", icon:"✨"},
    {title:"Lecture", sub:v.categoryLabel || "boutique", icon:v.categoryIcon || "🛍️"},
    {title:"Repère", sub:"présence publique", icon:"📍"},
    {title:"Style", sub:"présentation soignée", icon:"🌟"}
  ];

  return items.map((item, i) => ({
    src: makeSvgData(item.title, item.sub, item.icon, i % 2 ? c2 : c1, i % 2 ? c1 : c2),
    caption: `${item.title} — visuel`
  }));
}

function buildExampleProducts(v){
  const base = parsePriceBase(v.price);
  const parts = splitOffer(v.what);
  if(!parts.length){
    return [
      {title:"Produit exemple 1", desc:"À personnaliser plus tard.", price:"Prix à définir"},
      {title:"Produit exemple 2", desc:"À personnaliser plus tard.", price:"Prix à définir"},
      {title:"Produit exemple 3", desc:"À personnaliser plus tard.", price:"Prix à définir"},
      {title:"Produit exemple 4", desc:"À personnaliser plus tard.", price:"Prix à définir"}
    ];
  }
  return parts.map((part, i) => ({
    title: part,
    desc: `Mise en avant éditoriale pour ${v.name}.`,
    price: makePrice(base, 0.35 + (i * 0.18))
  }));
}

function buildRealPublicBlocks(v){
  const rows = [];

  if (v.categoryLabel) {
    rows.push({
      title: "Catégorie",
      desc: "Lecture publique visible sur la fiche.",
      price: v.categoryLabel
    });
  }

  if (v.city) {
    rows.push({
      title: "Ville",
      desc: "Repère terrain du commerçant.",
      price: v.city
    });
  }

  if (v.delivery_note) {
    rows.push({
      title: "Livraison",
      desc: "Information publique utile.",
      price: v.delivery_note
    });
  }

  if (v.payment_note) {
    rows.push({
      title: "Paiement",
      desc: "Mode ou repère de paiement communiqué.",
      price: v.payment_note
    });
  }

  return rows.slice(0,4);
}

function waLink(phone, text){
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

function mapsSearchUrl(query){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function applyTopBrand(cfg){
  if(cfg.logoUrl){
    document.getElementById("brandIcon").innerHTML = `<img src="${cfg.logoUrl}" alt="DIGIY">`;
  }
}

function makeSupabaseClient(){
  if (!window.supabase || !window.DIGIY_SUPABASE_URL || !(window.DIGIY_SUPABASE_ANON_KEY || window.DIGIY_SUPABASE_ANON)) {
    return null;
  }

  return window.supabase.createClient(
    window.DIGIY_SUPABASE_URL,
    window.DIGIY_SUPABASE_ANON_KEY || window.DIGIY_SUPABASE_ANON,
    {
      auth:{
        persistSession:false,
        autoRefreshToken:false,
        detectSessionInUrl:false
      }
    }
  );
}

async function loadPublicProfileBySlug(slug){
  const sb = makeSupabaseClient();
  if (!sb || !slug) return null;

  const { data, error } = await sb
    .from("digiy_market_public_profiles")
    .select("*")
    .eq("slug", slug)
    .maybeSingle();

  if (error) {
    console.error("public profile load error:", error);
    return null;
  }

  if (!data) return null;

  const cover =
    data.cover_url ||
    data.cover_image_url ||
    data.photo_url ||
    data.logo_url ||
    "";

  const photo =
    data.photo_url ||
    data.logo_url ||
    data.cover_url ||
    data.cover_image_url ||
    "";

  const images = [cover, photo].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i);

  return {
    mode: "real",
    slug: data.slug || slug,
    name: data.display_name || data.shop_name || data.business_name || "Boutique DIGIY",
    what: data.category || data.categories_text || "Boutique locale",
    loc: [data.city, data.address].filter(Boolean).join(" · ") || data.city || "Sénégal",
    city: data.city || "",
    address: data.address || "",
    categoryLabel: data.category || data.categories_text || "Boutique locale",
    categoryIcon: "🛍️",
    icon: "🛍️",
    price: "",
    live: data.is_published == null ? true : !!data.is_published,
    isExample: false,
    description: data.bio || data.description || "",
    whatsapp: normPhone(data.whatsapp || data.phone || ""),
    phone: normPhone(data.phone || ""),
    delivery_note: data.delivery_note || "",
    payment_note: data.payment_note || "",
    owner_name: data.owner_name || "",
    images,
    coverImage: cover || photo || "",
    raw: data
  };
}

(async function boot(){
  const catalog = readCatalog();
  const slug = String(getParam("slug") || "").trim().toLowerCase();
  const exampleSlug = String(getParam("v") || "").trim();

  const cfg = (catalog && catalog.config) ? { ...DEFAULT_CFG, ...catalog.config } : DEFAULT_CFG;
  applyTopBrand(cfg);

  if (slug) {
    const publicVendor = await loadPublicProfileBySlug(slug);
    if (publicVendor) {
      renderVendor(publicVendor, cfg);
      return;
    }
  }

  if (catalog && Array.isArray(catalog.vendors) && exampleSlug) {
    const vendor = catalog.vendors.find(v => v.slug === exampleSlug);
    if (vendor) {
      renderVendor(vendor, cfg);
      return;
    }
  }

  renderMissing();
})();
