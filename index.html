<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="index,follow">
  <title>DIGIY MARKET · Module multilingue</title>
  <style>html,body{margin:0;min-height:100%;background:#06140f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center;text-align:center}.loading{padding:24px;font-weight:900}</style>
</head>
<body>
  <p class="loading">DIGIY MARKET — chargement…</p>
  <script>
  (function(){
    var allowed=/^(fr|en|es|de|it|nl|ar)$/;
    var params=new URLSearchParams(location.search);
    var lang=(params.get('lang')||'').toLowerCase();
    try{if(!allowed.test(lang))lang=(localStorage.getItem('digiy-lang')||'').toLowerCase()}catch(e){}
    if(!allowed.test(lang))lang=(navigator.language||'fr').slice(0,2).toLowerCase();
    if(!allowed.test(lang))lang='fr';
    try{
      localStorage.setItem('digiy-lang',lang);
      if(lang==='fr')localStorage.removeItem('digiy_market_lang_v2');
      else localStorage.setItem('digiy_market_lang_v2','en');
    }catch(e){}
    fetch('./app.html?v=20260730-market7',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('load');return r.text()}).then(function(html){
      var inject='<base href="./">'+
        '<script>try{localStorage.setItem("digiy-lang","'+lang+'");if("'+lang+'"==="fr")localStorage.removeItem("digiy_market_lang_v2");else localStorage.setItem("digiy_market_lang_v2","en") }catch(e){}<\/script>'+
        '<script src="https://digiylyfe.com/assets/i18n/digiy-i18n.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-base.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-es.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-de.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-it.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-nl.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n-ar.js?v=20260730-market7" defer><\/script>'+
        '<script src="./market-i18n.js?v=20260730-market7" defer><\/script>'+
        '<script src="https://digiylyfe.com/assets/i18n/digiy-route.js?v=20260730-market7" data-lang="'+lang+'" defer><\/script>';
      html=html.replace(/<head([^>]*)>/i,'<head$1>'+inject);
      document.open();document.write(html);document.close();
    }).catch(function(){location.replace('./app.html?lang='+lang)});
  })();
  </script>
</body>
</html>
