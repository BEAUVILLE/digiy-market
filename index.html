<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <title>DIGIY MARKET — Public</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#061b14; --card:#0b2a1f; --line:rgba(255,255,255,.14);
      --text:#eafff1; --muted:rgba(234,255,241,.72);
      --gold:#facc15; --ok:#22c55e; --bad:#fb7185;
      --shadow:0 18px 55px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      background:radial-gradient(1000px 800px at 15% 10%, rgba(250,204,21,.10), transparent 45%),
                 radial-gradient(900px 700px at 85% 20%, rgba(34,197,94,.10), transparent 48%),
                 var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      padding:18px;
    }
    .wrap{width:min(1050px,100%); margin:0 auto}
    .top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start}
    h1{margin:0; font-size:18px; letter-spacing:.3px}
    .sub{color:var(--muted); font-size:13px; line-height:1.35}
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 10px; border-radius:999px;
      background:rgba(250,204,21,.12);
      border:1px solid rgba(250,204,21,.25);
      font-size:12px;
    }
    .bar{
      margin-top:14px;
      display:flex; gap:10px; flex-wrap:wrap;
      align-items:center;
    }
    input,select,button{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    button{
      cursor:pointer;
      background:rgba(250,204,21,.14);
      border:1px solid rgba(250,204,21,.26);
      font-weight:800;
    }
    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
    }
    @media (max-width: 980px){ .grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width: 650px){ .grid{grid-template-columns:1fr} }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .title{font-weight:900; letter-spacing:.2px}
    .meta{color:var(--muted); font-size:12px}
    .desc{font-size:13px; color:rgba(234,255,241,.92); line-height:1.35}
    .tags{margin-top:2px}
    .tag{
      display:inline-block;
      padding:4px 8px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      font-size:12px;
      margin:4px 6px 0 0;
      background:rgba(0,0,0,.18)
    }
    .actions{margin-top:auto; display:flex; gap:10px; flex-wrap:wrap}
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      text-decoration:none;
      color:var(--text);
      font-weight:900;
      background:rgba(250,204,21,.12);
      border:1px solid rgba(250,204,21,.28);
    }
    .btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      font-weight:800;
    }
    .empty{
      margin-top:22px;
      padding:18px;
      border-radius:16px;
      border:1px dashed rgba(255,255,255,.20);
      color:var(--muted);
      text-align:center;
    }
    .foot{margin-top:16px; color:var(--muted); font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>🦅 DIGIY MARKET — Public</h1>
      <div class="sub">Les annonces publiées. Direct. Local. Sans blabla.</div>
    </div>
    <div class="badge">🌍 Visible: <b>status=published</b> • 🔐 RLS friendly</div>
  </div>

  <div class="bar">
    <input id="q" placeholder="Rechercher: bissap, moringa, savon…" style="flex:1; min-width:220px"/>
    <select id="cat">
      <option value="">Toutes catégories</option>
      <option value="boisson">Boisson</option>
      <option value="commerce">Commerce</option>
      <option value="restaurant">Restaurant</option>
      <option value="logement">Logement</option>
      <option value="service">Service</option>
    </select>
    <button id="reload">🔄 Rafraîchir</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">Aucune annonce publiée pour l’instant.</div>

  <div class="foot">DIGIYLYFE ♾️ — économie locale, souveraineté digitale.</div>
</div>

<script>
  const SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNzg4ODIsImV4cCI6MjA4MDc1NDg4Mn0.dZfYOc2iL2_wRYL3zExZFsFSBK6AbMeOid2LrIjcTdA";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const el = (id)=>document.getElementById(id);

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function digits(s){ return String(s||"").replace(/\D/g,""); }

  function waLink(phoneDigits, msg){
    const p = digits(phoneDigits);
    if(!p) return null;
    return `https://wa.me/${p}?text=${encodeURIComponent(msg)}`;
  }

  function card(row){
    const tags = Array.isArray(row.tags) ? row.tags : [];
    const phone = row.owner_phone || "";
    const msg = `Salut, je suis intéressé par: ${row.title} (DIGIY MARKET).`;
    const wa = waLink(phone, msg);

    return `
      <div class="card">
        <div class="title">${esc(row.title || "Produit")}</div>
        <div class="meta">${esc(row.category_norm || "commerce")} • ${row.price_xof ? esc(row.price_xof)+" XOF" : "prix à discuter"}</div>
        <div class="desc">${esc(row.description || "")}</div>
        <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="actions">
          ${wa ? `<a class="btn" target="_blank" rel="noopener" href="${wa}">💬 WhatsApp</a>` : ""}
          <button class="btn secondary" onclick="navigator.clipboard.writeText('${esc(row.title||"Produit")}');">📋 Copier titre</button>
        </div>
      </div>
    `;
  }

  async function load(){
    el("empty").style.display="none";
    el("grid").innerHTML="";

    const q = (el("q").value||"").trim().toLowerCase();
    const cat = el("cat").value || "";

    let query = sb
      .from("digiy_market_listings")
      .select("id,title,description,category_norm,tags,price_xof,owner_phone,created_at")
      .eq("status","published")
      .order("created_at",{ascending:false})
      .limit(60);

    if(cat) query = query.eq("category_norm", cat);

    const { data, error } = await query;

    if(error){
      el("grid").innerHTML = `<div class="empty">Erreur: ${esc(error.message)}</div>`;
      return;
    }

    let rows = data || [];
    if(q){
      rows = rows.filter(r=>{
        const t = `${r.title||""} ${r.description||""} ${(r.tags||[]).join(" ")}`.toLowerCase();
        return t.includes(q);
      });
    }

    if(!rows.length){
      el("empty").style.display="block";
      return;
    }

    el("grid").innerHTML = rows.map(card).join("");
  }

  el("reload").addEventListener("click", load);
  el("q").addEventListener("input", ()=>{ clearTimeout(window.__t); window.__t=setTimeout(load,250); });
  el("cat").addEventListener("change", load);

  load();
</script>
</body>
</html>
