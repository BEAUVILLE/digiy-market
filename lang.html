<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#063b2b">
  <title>DIGIY MARKET — chargement multilingue</title>
  <style>html,body{margin:0;min-height:100%;background:#06140f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center;text-align:center}.loading{padding:24px;font-weight:900}</style>
</head>
<body>
  <p class="loading">DIGIY MARKET — chargement…</p>
  <script>
  (function(){
    var VERSION='20260731-market-inscription-resa-v3';
    var supported=/^(fr|en|es|de|it|nl|ar)$/;
    var allowed=['inscription-market.html','fiche.html','commander.html','shop.html'];
    var params=new URLSearchParams(location.search);
    var lang=(params.get('lang')||'').toLowerCase();
    var page=String(params.get('page')||'').trim();
    try{if(!supported.test(lang))lang=(localStorage.getItem('digiy-lang')||'').toLowerCase()}catch(e){}
    if(!supported.test(lang))lang=(navigator.language||'fr').slice(0,2).toLowerCase();
    if(!supported.test(lang))lang='fr';
    if(allowed.indexOf(page)<0){
      location.replace('./?lang='+encodeURIComponent(lang)+'&v='+encodeURIComponent(VERSION));
      return;
    }
    if(page==='shop.html')page='fiche.html';
    try{localStorage.setItem('digiy-lang',lang)}catch(e){}

    fetch('./'+page+'?v='+encodeURIComponent(VERSION),{cache:'no-store'})
      .then(function(response){if(!response.ok)throw new Error('load');return response.text()})
      .then(function(html){
        var inscriptionScripts=page==='inscription-market.html'
          ? '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-secondary-i18n-base.js?v=20260731" defer><\/script>'+ 
            '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-secondary-i18n-en-es.js?v=20260731" defer><\/script>'+ 
            '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-secondary-i18n-de-it.js?v=20260731" defer><\/script>'+ 
            '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-secondary-i18n-nl-ar.js?v=20260731" defer><\/script>'+ 
            '<script src="./assets/js/market-resa-adapter-base.js?v='+VERSION+'" defer><\/script>'+ 
            '<script src="./assets/js/market-resa-adapter-en-es.js?v='+VERSION+'" defer><\/script>'+ 
            '<script src="./assets/js/market-resa-adapter-de-it.js?v='+VERSION+'" defer><\/script>'+ 
            '<script src="./assets/js/market-resa-adapter-nl-ar.js?v='+VERSION+'" defer><\/script>'+ 
            '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-secondary-i18n.js?v=20260731" defer><\/script>'+ 
            '<script src="https://resa-table-resto.digiylyfe.com/assets/js/resa-message-i18n-bridge.js?v=20260731" defer><\/script>'
          : '';

        var inject='<base href="./">'+
          '<script>window.__DIGIY_MARKET_PAGE__="'+page+'";window.DIGIY_MARKET_PAGE_TRANSLATIONS={};try{localStorage.setItem("digiy-lang","'+lang+'")}catch(e){}<\/script>'+
          '<script src="./market-pages-i18n-en.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-pages-i18n-es.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-pages-i18n-de.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-pages-i18n-it.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-pages-i18n-nl.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-pages-i18n-ar.js?v='+VERSION+'" defer><\/script>'+
          '<script src="https://digiylyfe.com/assets/i18n/digiy-i18n.js?v='+VERSION+'" defer><\/script>'+
          inscriptionScripts+
          '<script src="./market-pages-i18n-core.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-products-i18n.js?v='+VERSION+'" defer><\/script>'+
          '<script src="./market-public-route.js?v='+VERSION+'" defer><\/script>';
        html=html.replace(/<head([^>]*)>/i,'<head$1>'+inject);
        document.open();document.write(html);document.close();
      })
      .catch(function(){
        var direct=new URL('./'+page,location.origin+'/');
        params.forEach(function(value,key){if(key!=='page'&&key!=='v')direct.searchParams.append(key,value)});
        direct.searchParams.set('lang',lang);
        location.replace(direct.toString());
      });
  })();
  </script>
</body>
</html>
