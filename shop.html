<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Redirection DIGIY MARKET</title>
  <script>
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("slug") || "";
    location.replace(slug ? "./fiche.html?slug=" + encodeURIComponent(slug) : "./index.html");
  </script>
</head>
